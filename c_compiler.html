<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Compiler — Class 12 'C'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --surface2:  #2A2C31;
    --border:    rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
    --green:     #4FBF7A;
    --green-dim: rgba(79,191,122,0.12);
    --red:       #E0736E;
    --red-dim:   rgba(224,115,110,0.12);
    --amber:     #E0B15C;
    --amber-dim: rgba(224,177,92,0.12);
    --purple:    #B39CF0;
    --purple-dim:rgba(179,156,240,0.12);
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --surface2:  #F0F0F0;
    --border:    rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
    --green:     #278049;
    --green-dim: rgba(39,128,73,0.08);
    --red:       #C1443C;
    --red-dim:   rgba(193,68,60,0.08);
    --amber:     #B8791A;
    --amber-dim: rgba(184,121,26,0.08);
    --purple:    #6D3FC7;
    --purple-dim:rgba(109,63,199,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:96px 20px 64px;
    transition:background .2s ease, color .2s ease;
  }

  /* topbar */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:100;
  }
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border-strong);
    border-radius:100px; padding:8px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-btn:hover{ border-color:var(--text-mute); }
  .page-title-bar{ font-size:13px; font-weight:600; color:var(--text-dim); }

  .theme-toggle{
    width:56px; height:30px; border-radius:100px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; position:relative;
    cursor:pointer; flex-shrink:0; padding:0 7px;
    justify-content:space-between;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:13px; height:13px; z-index:1; position:relative; }
  .theme-toggle .icon-sun{ color:#B8871F; opacity:.5; }
  .theme-toggle .icon-moon{ color:#EDEDEF; opacity:.5; }
  [data-theme="light"] .theme-toggle .icon-sun{ opacity:1; }
  [data-theme="dark"] .theme-toggle .icon-moon{ opacity:1; }
  .toggle-knob{
    position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="light"] .toggle-knob{ transform:translateX(26px); }

  /* main */
  .wrap{ max-width:900px; margin:0 auto; }
  .page-heading{ margin-bottom:28px; }
  .page-heading h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .page-heading p{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .panel{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:12px;
    margin-bottom:20px; overflow:hidden;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--border);
    background:var(--surface2);
  }
  .panel-label{ font-size:13px; font-weight:600; color:var(--text-dim); }

  textarea#code{
    width:100%; min-height:340px; resize:vertical;
    background:var(--surface); color:var(--text);
    border:none; outline:none;
    font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.6;
    padding:16px 18px; tab-size:4;
  }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select, input#stdin-input{
    background:var(--surface2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:8px;
    font-family:'Inter',sans-serif; font-size:13px; padding:7px 10px;
    outline:none;
  }
  select:focus, input#stdin-input:focus{ border-color:var(--accent); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 18px; border-radius:8px;
    font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:none;
    transition:opacity .15s ease, transform .1s ease; white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ opacity:.85; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-run{ background:var(--green-dim); color:var(--green); }
  .btn-clear{ background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong); }

  .stdin-row{ padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .stdin-row label{ font-size:12.5px; color:var(--text-dim); font-weight:600; flex-shrink:0; }
  input#stdin-input{ flex:1; min-width:0; }

  pre#output{
    margin:0; padding:16px 18px; min-height:120px; max-height:400px; overflow:auto;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word;
    color:var(--text-dim);
  }
  pre#output.ok{ color:var(--text); }
  pre#output.err{ color:var(--red); }

  .status-dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    background:var(--text-mute);
  }
  .status-dot.running{ background:var(--amber); animation:pulse 1s ease-in-out infinite; }
  .status-dot.success{ background:var(--green); }
  .status-dot.error{ background:var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .status-text{ font-size:12px; color:var(--text-mute); }
  .status-row{ display:flex; align-items:center; gap:8px; }

  @media (max-width:560px){
    .page-title-bar{ display:none; }
    .toolbar{ width:100%; }
    .btn-run{ flex:1; }
  }
  @media (prefers-reduced-motion: reduce){ .btn, .toggle-knob{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html">← Back</a>
  <span class="page-title-bar">C Compiler</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" role="switch" aria-checked="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <div class="toggle-knob"></div>
  </button>
</div>

<div class="wrap">
  <div class="page-heading">
    <h1>C Compiler</h1>
    <p>Write, compile, and run C code right in your browser.</p>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">main.c</span>
      <div class="toolbar">
        <select id="langVersion">
          <option value="gcc-head-c">GCC (head)</option>
          <option value="gcc-13.2.0-c">GCC 13.2.0</option>
          <option value="gcc-12.1.0-c">GCC 12.1.0</option>
          <option value="clang-head-c">Clang (head)</option>
        </select>
        <button class="btn btn-clear" id="clearBtn">Clear</button>
        <button class="btn btn-run" id="runBtn">▶ Run</button>
      </div>
    </div>
    <textarea id="code" spellcheck="false">#include <stdio.h>

int main() {
    printf("Hello! Made by Unish\n");
    return 0;
}</textarea>
    <div class="stdin-row">
      <label for="stdin-input">stdin</label>
      <input id="stdin-input" type="text" placeholder="Optional input passed to your program">
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Output</span>
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Idle</span>
      </div>
    </div>
    <pre id="output">Hello! Made by Unish</pre>
  </div>
</div>

<script>
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    btn.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
  }
  applyTheme(theme);
  btn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

  const codeEl = document.getElementById('code');
  const runBtn = document.getElementById('runBtn');
  const clearBtn = document.getElementById('clearBtn');
  const outputEl = document.getElementById('output');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const stdinInput = document.getElementById('stdin-input');

  // Tab key inserts spaces instead of moving focus
  codeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = codeEl.selectionStart, end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, start) + '    ' + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
    }
  });

  clearBtn.addEventListener('click', () => {
    codeEl.value = '';
    outputEl.textContent = 'Hello! Made by Unish';
    outputEl.className = '';
    statusDot.className = 'status-dot';
    statusText.textContent = 'Idle';
    codeEl.focus();
  });

  async function runCode() {
    const source = codeEl.value;
    if (!source.trim()) {
      outputEl.textContent = 'Write some C code first.';
      outputEl.className = 'err';
      return;
    }

    runBtn.disabled = true;
    runBtn.textContent = '⏳ Running...';
    statusDot.className = 'status-dot running';
    statusText.textContent = 'Compiling & running';
    outputEl.className = '';
    outputEl.textContent = 'Working...';

    try {
      const compilerId = document.getElementById('langVersion').value;
      const res = await fetch('https://wandbox.org/api/compile.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: source,
          compiler: compilerId,
          stdin: stdinInput.value || '',
          options: 'warning,gnu17'
        })
      });

      if (!res.ok) throw new Error('Network response was not OK (' + res.status + ')');
      const data = await res.json();

      let text = '';
      if (data.compiler_output) text += data.compiler_output;
      if (data.compiler_error) text += data.compiler_error;
      if (data.program_output) text += data.program_output;
      if (data.program_error) text += data.program_error;

      const compileFailed = data.compiler_error && !data.program_output && !data.program_error && data.status !== '0';
      const hadRuntimeError = data.status !== undefined && data.status !== '0';

      if (!text.trim()) text = '(no output)';
      outputEl.textContent = text;

      if (hadRuntimeError) {
        outputEl.className = 'err';
        statusDot.className = 'status-dot error';
        statusText.textContent = compileFailed ? 'Compile error' : `Exited with code ${data.status}`;
      } else {
        outputEl.className = 'ok';
        statusDot.className = 'status-dot success';
        statusText.textContent = 'Success';
      }
    } catch (err) {
      outputEl.textContent = 'Error reaching the compiler service: ' + err.message + '\n\nCheck your internet connection and try again.';
      outputEl.className = 'err';
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Failed';
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = '▶ Run';
    }
  }

  runBtn.addEventListener('click', runCode);

  // Ctrl+Enter / Cmd+Enter to run
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
</script>
</body>
</html>
