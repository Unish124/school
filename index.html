<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 12 'C' — Student Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --border:    rgba(255,255,255,0.09);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --border:    rgba(0,0,0,0.08);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:56px 20px 64px;
    display:flex; flex-direction:column; align-items:center;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{ width:100%; max-width:720px; }

  /* header */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:36px; }
  h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  p.sub{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .theme-toggle{
    width:40px; height:40px; border-radius:10px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; flex-shrink:0;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* link cards */
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:44px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px; text-decoration:none; color:inherit;
    display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:var(--text-mute); transform:translateY(-2px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card-icon{
    width:34px; height:34px; border-radius:8px; background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .card-title{ font-size:15px; font-weight:600; }
  .card-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.55; flex:1; }
  .card-link{ font-size:12.5px; font-weight:600; color:var(--accent); }

  @media (max-width:640px){
    .cards{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ .card{ transition:none; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Class 12 'C'</h1>
      <p class="sub">Quick links for our section.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
  </div>

  <div class="cards">
    <a class="card" href="routine.html">
      <div class="card-icon">🗓️</div>
      <div class="card-title">Routine</div>
      <div class="card-desc">Daily class schedule — periods, subjects, and teachers.</div>
      <div class="card-link">Open →</div>
    </a>
    <a class="card" href="books.html">
      <div class="card-icon">📚</div>
      <div class="card-title">Books</div>
      <div class="card-desc">Textbooks and reference material for every subject.</div>
      <div class="card-link">Open →</div>
    </a>
    <a class="card" href="notes.html">
      <div class="card-icon">📝</div>
      <div class="card-title">Notes</div>
      <div class="card-desc">Class notes and important questions shared by classmates.</div>
      <div class="card-link">Open →</div>
    </a>
  </div>


</div>

<script>
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '🌙' : '☀️';
  }
  applyTheme(theme);
  btn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
