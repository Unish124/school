<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Compiler — Class 12 'C'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --surface2:  #2A2C31;
    --border:    rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
    --green:     #4FBF7A;
    --green-dim: rgba(79,191,122,0.12);
    --amber:     #E0B15C;
    --amber-dim: rgba(224,177,92,0.12);
    --purple:    #B39CF0;
    --purple-dim:rgba(179,156,240,0.12);
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --surface2:  #F0F0F0;
    --border:    rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
    --green:     #278049;
    --green-dim: rgba(39,128,73,0.08);
    --amber:     #B8791A;
    --amber-dim: rgba(184,121,26,0.08);
    --purple:    #6D3FC7;
    --purple-dim:rgba(109,63,199,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:96px 20px 64px;
    transition:background .2s ease, color .2s ease;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:100;
  }
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border-strong);
    border-radius:100px; padding:8px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-btn:hover{ border-color:var(--text-mute); }
  .page-title-bar{ font-size:13px; font-weight:600; color:var(--text-dim); }

  .theme-toggle{
    width:56px; height:30px; border-radius:100px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; position:relative;
    cursor:pointer; flex-shrink:0; padding:0 7px;
    justify-content:space-between;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:13px; height:13px; z-index:1; position:relative; }
  .theme-toggle .icon-sun{ color:#B8871F; opacity:.5; }
  .theme-toggle .icon-moon{ color:#EDEDEF; opacity:.5; }
  [data-theme="light"] .theme-toggle .icon-sun{ opacity:1; }
  [data-theme="dark"] .theme-toggle .icon-moon{ opacity:1; }
  .toggle-knob{
    position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="light"] .toggle-knob{ transform:translateX(26px); }

  .wrap{ max-width:900px; margin:0 auto; }
  .page-heading{ margin-bottom:28px; }
  .page-heading h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .page-heading p{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .panel{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:12px;
    margin-bottom:20px; overflow:hidden;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 8px; border-bottom:1px solid var(--border);
    background:var(--surface2); flex-wrap:wrap;
  }

  /* file tabs (HTML / CSS / JS) */
  .file-tabs{ display:flex; gap:2px; }
  .file-tab{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:none; border-bottom:2px solid transparent;
    color:var(--text-dim); font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:600; padding:12px 14px; cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .file-tab:hover{ color:var(--text); }
  .file-tab.active{ color:var(--text); border-bottom-color:var(--accent); }
  .file-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .file-tab[data-file="html"] .file-dot{ background:var(--purple); }
  .file-tab[data-file="css"] .file-dot{ background:var(--accent); }
  .file-tab[data-file="js"] .file-dot{ background:var(--amber); }

  .toolbar{ display:flex; align-items:center; gap:10px; padding:8px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 18px; border-radius:8px;
    font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:none;
    transition:opacity .15s ease, transform .1s ease; white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ opacity:.85; }
  .btn:active{ transform:scale(.97); }
  .btn-run{ background:var(--green-dim); color:var(--green); }
  .btn-clear{ background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong); }
  .btn-fullscreen{
    background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong);
    padding:8px 10px;
  }
  .btn-fullscreen svg{ width:15px; height:15px; display:block; }
  .btn-wrap{
    background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong);
    padding:8px 10px;
  }
  .btn-wrap svg{ width:15px; height:15px; display:block; }
  .btn-wrap.active{ background:var(--accent-dim); color:var(--accent); border-color:transparent; }
  textarea.code-input.wrap-on{ white-space:pre-wrap; overflow-x:hidden; word-break:break-word; }

  /* code editor with line-number gutter (shared across the html/css/js tabs) */
  .code-editor{ position:relative; display:flex; background:var(--surface); }
  .gutter{
    flex-shrink:0;
    width:44px;
    padding:16px 0;
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-mute);
    background:var(--surface2);
    border-right:1px solid var(--border);
    overflow:hidden;
    user-select:none;
  }
  .gutter div{ padding-right:10px; }

  .code-stack{ flex:1; position:relative; min-width:0; }
  textarea.code-input{
    display:none;
    width:100%; min-height:300px; resize:vertical;
    background:var(--surface); color:var(--text);
    border:none; outline:none;
    font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.6;
    padding:16px 18px; tab-size:2;
    white-space:pre;
    overflow:auto;
  }
  textarea.code-input.active{ display:block; }

  .panel.is-fullscreen{
    position:fixed; inset:0; z-index:1000; margin:0; border-radius:0;
    display:flex; flex-direction:column; height:100vh;
  }
  .panel.is-fullscreen .code-editor{ flex:1; }
  .panel.is-fullscreen textarea.code-input.active{ min-height:100%; height:100%; }

  iframe#preview{
    width:100%; height:420px; border:none; background:#fff; display:block;
  }

  @media (max-width:560px){
    .page-title-bar{ display:none; }
    .toolbar{ width:100%; }
    .btn-run{ flex:1; }
    .file-tab{ padding:10px 10px; font-size:12px; }
  }
  @media (prefers-reduced-motion: reduce){ .btn, .toggle-knob{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="compiler.html">← Back</a>
  <span class="page-title-bar">HTML Compiler</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" role="switch" aria-checked="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <div class="toggle-knob"></div>
  </button>
</div>

<div class="wrap">
  <div class="page-heading">
    <h1>HTML Compiler</h1>
    <p>Write HTML, CSS, and JavaScript with an instant live preview.</p>
  </div>

  <div class="panel" id="codePanel">
    <div class="panel-header">
      <div class="file-tabs">
        <button class="file-tab active" data-file="html"><span class="file-dot"></span>HTML</button>
        <button class="file-tab" data-file="css"><span class="file-dot"></span>CSS</button>
        <button class="file-tab" data-file="js"><span class="file-dot"></span>JS</button>
      </div>
      <div class="toolbar">
        <button class="btn btn-fullscreen" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
          <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <button class="btn btn-wrap" id="wrapBtn" type="button" aria-label="Toggle word wrap" title="Word wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M3 12h13a3 3 0 0 1 0 6h-4m0 0 2-2m-2 2 2 2M3 18h4"/>
          </svg>
        </button>
        <button class="btn btn-clear" id="clearBtn">Clear</button>
        <button class="btn btn-run" id="runBtn">▶ Run</button>
      </div>
    </div>
    <div class="code-editor">
      <div class="gutter" id="gutter"><div>1</div></div>
      <div class="code-stack">
        <textarea id="html-code" class="code-input active" spellcheck="false"><h1>Hello! Made by Unish</h1>
<p>Edit the HTML, CSS, and JS tabs, then hit Run.</p>
<p id="clock">Loading time...</p></textarea>
        <textarea id="css-code" class="code-input" spellcheck="false">body {
  font-family: sans-serif;
  text-align: center;
  margin-top: 60px;
}

h1 {
  color: #3854D6;
}

#clock {
  font-size: 24px;
  font-weight: bold;
  color: #4FBF7A;
}</textarea>
        <textarea id="js-code" class="code-input" spellcheck="false">function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString();
}

updateClock();
setInterval(updateClock, 1000);</textarea>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span style="font-size:13px; font-weight:600; color:var(--text-dim); padding:12px 14px;">Preview</span>
    </div>
    <iframe id="preview" title="HTML preview" sandbox="allow-scripts allow-modals"></iframe>
  </div>
</div>

<script>
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
  }
  applyTheme(theme);
  themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

  /* file tab switching */
  const fileTabs = document.querySelectorAll('.file-tab');
  const editors = {
    html: document.getElementById('html-code'),
    css: document.getElementById('css-code'),
    js: document.getElementById('js-code')
  };

  const gutterEl = document.getElementById('gutter');

  function activeEditor() {
    return Object.values(editors).find(e => e.classList.contains('active'));
  }

  function updateGutter() {
    const ta = activeEditor();
    if (!ta) return;
    const lineCount = ta.value.split('\n').length;
    let out = '';
    for (let i = 1; i <= lineCount; i++) out += '<div>' + i + '</div>';
    gutterEl.innerHTML = out;
    gutterEl.scrollTop = ta.scrollTop;
  }

  fileTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      fileTabs.forEach(t => t.classList.remove('active'));
      Object.values(editors).forEach(e => e.classList.remove('active'));
      tab.classList.add('active');
      editors[tab.dataset.file].classList.add('active');
      updateGutter();
    });
  });

  /* Tab key inserts spaces in whichever editor is focused, and keep the
     gutter (line numbers + scroll sync) up to date for each editor */
  Object.values(editors).forEach(ta => {
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
        updateGutter();
      }
    });
    ta.addEventListener('input', updateGutter);
    ta.addEventListener('scroll', () => {
      if (ta.classList.contains('active')) gutterEl.scrollTop = ta.scrollTop;
    });
  });
  window.addEventListener('resize', updateGutter);
  updateGutter();

  /* fullscreen toggle */
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fullscreenIcon = document.getElementById('fullscreenIcon');
  const codePanel = document.getElementById('codePanel');

  const EXPAND_PATH = 'M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3';
  const COLLAPSE_PATH = 'M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3';

  function setFullscreenIcon(isFull) {
    fullscreenIcon.querySelector('path').setAttribute('d', isFull ? COLLAPSE_PATH : EXPAND_PATH);
    fullscreenBtn.title = isFull ? 'Exit fullscreen' : 'Fullscreen';
  }

  fullscreenBtn.addEventListener('click', async () => {
    const supportsFS = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (supportsFS) {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          await (codePanel.requestFullscreen ? codePanel.requestFullscreen() : codePanel.webkitRequestFullscreen());
        } else {
          await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
        }
        return;
      } catch (e) {
        // fall through to CSS-only fallback below
      }
    }
    codePanel.classList.toggle('is-fullscreen');
    setFullscreenIcon(codePanel.classList.contains('is-fullscreen'));
  });

  document.addEventListener('fullscreenchange', () => {
    setFullscreenIcon(!!document.fullscreenElement);
    updateGutter();
  });
  document.addEventListener('webkitfullscreenchange', () => {
    setFullscreenIcon(!!document.webkitFullscreenElement);
    updateGutter();
  });

  const wrapBtn = document.getElementById('wrapBtn');
  wrapBtn.addEventListener('click', () => {
    const wrapOn = !editors.html.classList.contains('wrap-on');
    Object.values(editors).forEach(e => e.classList.toggle('wrap-on', wrapOn));
    wrapBtn.classList.toggle('active', wrapOn);
    updateGutter();
  });

  const previewEl = document.getElementById('preview');
  const runBtn = document.getElementById('runBtn');
  const clearBtn = document.getElementById('clearBtn');

  function buildDocument() {
    return `<!DOCTYPE html>
<html>
<head>
<style>
${editors.css.value}
</style>
</head>
<body>
${editors.html.value}
<script>
${editors.js.value}
<\/script>
</body>
</html>`;
  }

  function runCode() {
    previewEl.srcdoc = buildDocument();
  }

  clearBtn.addEventListener('click', () => {
    editors.html.value = '';
    editors.css.value = '';
    editors.js.value = '';
    previewEl.srcdoc = '<p style="font-family:sans-serif;text-align:center;margin-top:60px;color:#9C9CA5;">Hello! Made by Unish</p>';
    updateGutter();
  });

  runBtn.addEventListener('click', runCode);

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });

  // Show initial preview on load
  runCode();
</script>
</body>
</html>
