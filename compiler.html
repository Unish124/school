<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compiler — Class 12 'C'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --surface2:  #2A2C31;
    --border:    rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
    --green:     #4FBF7A;
    --green-dim: rgba(79,191,122,0.12);
    --amber:     #E0B15C;
    --amber-dim: rgba(224,177,92,0.12);
    --purple:    #B39CF0;
    --purple-dim:rgba(179,156,240,0.12);
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --surface2:  #F0F0F0;
    --border:    rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
    --green:     #278049;
    --green-dim: rgba(39,128,73,0.08);
    --amber:     #B8791A;
    --amber-dim: rgba(184,121,26,0.08);
    --purple:    #6D3FC7;
    --purple-dim:rgba(109,63,199,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:96px 20px 64px;
    transition:background .2s ease, color .2s ease;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:100;
  }
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border-strong);
    border-radius:100px; padding:8px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-btn:hover{ border-color:var(--text-mute); }
  .page-title-bar{ font-size:13px; font-weight:600; color:var(--text-dim); }

  .theme-toggle{
    width:56px; height:30px; border-radius:100px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; position:relative;
    cursor:pointer; flex-shrink:0; padding:0 7px;
    justify-content:space-between;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:13px; height:13px; z-index:1; position:relative; }
  .theme-toggle .icon-sun{ color:#B8871F; opacity:.5; }
  .theme-toggle .icon-moon{ color:#EDEDEF; opacity:.5; }
  [data-theme="light"] .theme-toggle .icon-sun{ opacity:1; }
  [data-theme="dark"] .theme-toggle .icon-moon{ opacity:1; }
  .toggle-knob{
    position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="light"] .toggle-knob{ transform:translateX(26px); }

  .wrap{ max-width:720px; margin:0 auto; }
  .page-heading{ margin-bottom:28px; }
  .page-heading h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .page-heading p{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .card{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:12px;
    padding:22px 20px; text-decoration:none; color:inherit;
    display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ transform:translateY(-2px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card-icon{
    width:38px; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
  }
  .card-icon svg{ width:20px; height:20px; display:block; }
  .card[data-lang="c"] .card-icon{ background:var(--amber-dim); }
  .card[data-lang="c"]:hover{ border-color:var(--amber); }
  .card[data-lang="html"] .card-icon{ background:var(--purple-dim); }
  .card[data-lang="html"]:hover{ border-color:var(--purple); }
  .card[data-lang="sql"] .card-icon{ background:var(--green-dim); }
  .card[data-lang="sql"]:hover{ border-color:var(--green); }

  .card-title{ font-size:15.5px; font-weight:700; }
  .card-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.55; flex:1; }
  .card-link{ font-size:12.5px; font-weight:600; color:var(--accent); }

  @media (max-width:640px){
    .cards{ grid-template-columns:1fr; }
    .page-title-bar{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ .card, .toggle-knob{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html">← Back</a>
  <span class="page-title-bar">Compiler</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" role="switch" aria-checked="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <div class="toggle-knob"></div>
  </button>
</div>

<div class="wrap">
  <div class="page-heading">
    <h1>Compiler</h1>
    <p>Choose a language to start writing and running code.</p>
  </div>

  <div class="cards">
    <a class="card" data-lang="c" href="c_compiler.html">
      <div class="card-icon">
        <!-- C logo -->
        <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <path fill="#659AD2" d="M117.5 33.5 67.1 4.6a6.4 6.4 0 0 0-6.2 0L10.5 33.5A6.4 6.4 0 0 0 7.3 39v57.8a6.4 6.4 0 0 0 3.2 5.6l50.4 28.9a6.4 6.4 0 0 0 6.2 0l50.4-28.9a6.4 6.4 0 0 0 3.2-5.6V39a6.4 6.4 0 0 0-3.2-5.5Z"/>
          <path fill="#03599C" d="M64 63.9 10.5 33.5a6.5 6.5 0 0 0-3.2 5.5v57.8a6.4 6.4 0 0 0 3.2 5.6l50.4 28.9a6.6 6.6 0 0 0 5 .7V63.9Z"/>
          <path fill="#fff" d="M64 24.2c11.9 0 22.4 6.2 28.3 15.7l-14.2 8.3a16.5 16.5 0 0 0-14.1-8 16.7 16.7 0 0 0 0 33.4c6 0 11.2-3.1 14.2-8l14.1 8.3a32.8 32.8 0 0 1-28.3 15.7 32.8 32.8 0 1 1 0-65.4Z"/>
        </svg>
      </div>
      <div class="card-title">C</div>
      <div class="card-desc">Write, compile, and run C programs with real GCC/Clang output.</div>
      <div class="card-link">Open →</div>
    </a>
    <a class="card" data-lang="html" href="html_compiler.html">
      <div class="card-icon">
        <!-- HTML5 logo -->
        <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <path fill="#E44D26" d="M19.4 116 9.5 4.6h109l-9.9 111.3L63.9 128z"/>
          <path fill="#F16529" d="M64 118.8 99.9 109l8.5-95H64z"/>
          <path fill="#EBEBEB" d="M64 52.4H46.1L44.9 39H64V25.7H30.4l.3 3.6L34 66.3h30z"/>
          <path fill="#fff" d="M64 84.6 49.7 80.8l-.9-10.4h-13.4l1.8 20.4L64 97.7z"/>
          <path fill="#EBEBEB" d="M63.9 52.4v13.9h16.7l-1.6 17.7L63.9 88v14.4l27.3-7.6.2-2.3 3.1-35.2.3-3.6H63.9z"/>
          <path fill="#fff" d="M63.9 25.7v13.4h32.4l.3-3.1.6-6.7.3-3.6z"/>
        </svg>
      </div>
      <div class="card-title">HTML</div>
      <div class="card-desc">Write HTML, CSS, and JS with an instant live preview.</div>
      <div class="card-link">Open →</div>
    </a>
    <a class="card" data-lang="sql" href="sql_compiler.html">
      <div class="card-icon">
        <!-- SQL / database logo -->
        <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="64" cy="26" rx="50" ry="20" fill="#4FBF7A"/>
          <path fill="#3C9A63" d="M14 26v25c0 11 22.4 20 50 20s50-9 50-20V26c0 11-22.4 20-50 20S14 37 14 26Z"/>
          <path fill="#4FBF7A" opacity=".85" d="M14 51v25c0 11 22.4 20 50 20s50-9 50-20V51c0 11-22.4 20-50 20S14 62 14 51Z"/>
          <path fill="#3C9A63" d="M14 76v26c0 11 22.4 20 50 20s50-9 50-20V76c0 11-22.4 20-50 20S14 87 14 76Z"/>
        </svg>
      </div>
      <div class="card-title">SQL</div>
      <div class="card-desc">Run SQL queries against a sample database, right in your browser.</div>
      <div class="card-link">Open →</div>
    </a>
  </div>
</div>

<script>
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    btn.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
  }
  applyTheme(theme);
  btn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
