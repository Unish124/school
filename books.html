<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books — Class 12 'C'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --surface2:  #2A2C31;
    --border:    rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
    --green:     #4FBF7A;
    --green-dim: rgba(79,191,122,0.12);
    --red:       #E0736E;
    --red-dim:   rgba(224,115,110,0.12);
    --amber:     #E0B15C;
    --amber-dim: rgba(224,177,92,0.12);
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --surface2:  #F0F0F0;
    --border:    rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
    --green:     #278049;
    --green-dim: rgba(39,128,73,0.08);
    --red:       #C1443C;
    --red-dim:   rgba(193,68,60,0.08);
    --amber:     #B8791A;
    --amber-dim: rgba(184,121,26,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:96px 20px 64px;
    transition:background .2s ease, color .2s ease;
  }

  /* topbar */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:100;
  }
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border-strong);
    border-radius:100px; padding:8px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-btn:hover{ border-color:var(--text-mute); }
  .page-title-bar{ font-size:13px; font-weight:600; color:var(--text-dim); }

  .theme-toggle{
    width:56px; height:30px; border-radius:100px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; position:relative;
    cursor:pointer; flex-shrink:0; padding:0 7px;
    justify-content:space-between;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:13px; height:13px; z-index:1; position:relative; }
  .theme-toggle .icon-sun{ color:#B8871F; opacity:.5; }
  .theme-toggle .icon-moon{ color:#EDEDEF; opacity:.5; }
  [data-theme="light"] .theme-toggle .icon-sun{ opacity:1; }
  [data-theme="dark"] .theme-toggle .icon-moon{ opacity:1; }
  .toggle-knob{
    position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="light"] .toggle-knob{ transform:translateX(26px); }

  /* main */
  .wrap{ max-width:720px; margin:0 auto; }
  .page-heading{ margin-bottom:28px; }
  .page-heading h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .page-heading p{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  /* book cards */
  .books-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .book-card{
    background:var(--surface2); border:1px solid var(--border-strong); border-radius:12px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .book-card:hover{ border-color:var(--text-mute); transform:translateY(-2px); }

  .book-top{ display:flex; align-items:center; gap:12px; }
  .book-subject{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:3px; }
  .book-title{ font-size:15px; font-weight:600; line-height:1.3; }

  .book-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:14px; border-top:1px solid var(--border); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:9px 10px; border-radius:8px;
    font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:none;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:.85; }
  .btn-view{ background:var(--accent-dim); color:var(--accent); }
  .btn-download{ background:var(--green-dim); color:var(--green); }

  .book-card.physics   .book-subject{ color:var(--red); }
  .book-card.chemistry .book-subject{ color:var(--accent); }
  .book-card.computer  .book-subject{ color:var(--amber); }

  @media (max-width:500px){
    .books-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ .book-card, .btn, .toggle-knob{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html">← Back</a>
  <span class="page-title-bar">Books</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" role="switch" aria-checked="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <div class="toggle-knob"></div>
  </button>
</div>

<div class="wrap">
  <div class="page-heading">
    <h1>Books</h1>
    <p>Class 12 Science — read online or download to your device.</p>
  </div>

  <div class="books-grid">

    <div class="book-card physics">
      <div class="book-top">
        <div>
          <div class="book-subject">Physics</div>
          <div class="book-title">Physics Textbook</div>
        </div>
      </div>
      <div class="book-actions">
        <a class="btn btn-view" href="books/physics_textbook_12.pdf" target="_blank">View</a>
        <a class="btn btn-download" href="books/physics_textbook_12.pdf" download>Download</a>
      </div>
    </div>

    <div class="book-card chemistry">
      <div class="book-top">
        <div>
          <div class="book-subject">Chemistry</div>
          <div class="book-title">Chemistry Textbook</div>
        </div>
      </div>
      <div class="book-actions">
        <a class="btn btn-view" href="books/chemistry_textbook_12.pdf" target="_blank">View</a>
        <a class="btn btn-download" href="books/chemistry_textbook_12.pdf" download>Download</a>
      </div>
    </div>

    <div class="book-card computer">
      <div class="book-top">
        <div>
          <div class="book-subject">Computer Science</div>
          <div class="book-title">Computer Textbook</div>
        </div>
      </div>
      <div class="book-actions">
        <a class="btn btn-view" href="books/computer_textbook_12.pdf" target="_blank">View</a>
        <a class="btn btn-download" href="books/computer_textbook_12.pdf" download>Download</a>
      </div>
    </div>

  </div>
</div>

<script>
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    btn.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
  }
  applyTheme(theme);
  btn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
