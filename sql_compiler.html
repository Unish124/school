<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Compiler — Class 12 'C'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg:        #16171A;
    --surface:   #1D1E22;
    --surface2:  #2A2C31;
    --border:    rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:      #EDEDEF;
    --text-dim:  #9C9CA5;
    --text-mute: #616168;
    --accent:    #6C8CFF;
    --accent-dim:rgba(108,140,255,0.12);
    --green:     #4FBF7A;
    --green-dim: rgba(79,191,122,0.12);
    --red:       #E0736E;
    --red-dim:   rgba(224,115,110,0.12);
    --amber:     #E0B15C;
  }
  [data-theme="light"] {
    --bg:        #FAFAFA;
    --surface:   #FFFFFF;
    --surface2:  #F0F0F0;
    --border:    rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text:      #17181C;
    --text-dim:  #5B5C63;
    --text-mute: #9B9BA3;
    --accent:    #3854D6;
    --accent-dim:rgba(56,84,214,0.08);
    --green:     #278049;
    --green-dim: rgba(39,128,73,0.08);
    --red:       #C1443C;
    --red-dim:   rgba(193,68,60,0.08);
    --amber:     #B8791A;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:96px 20px 64px;
    transition:background .2s ease, color .2s ease;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; z-index:100;
  }
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border-strong);
    border-radius:100px; padding:8px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-btn:hover{ border-color:var(--text-mute); }
  .page-title-bar{ font-size:13px; font-weight:600; color:var(--text-dim); }

  .theme-toggle{
    width:56px; height:30px; border-radius:100px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; position:relative;
    cursor:pointer; flex-shrink:0; padding:0 7px;
    justify-content:space-between;
    transition:border-color .15s ease;
  }
  .theme-toggle:hover{ border-color:var(--text-mute); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:13px; height:13px; z-index:1; position:relative; }
  .theme-toggle .icon-sun{ color:#B8871F; opacity:.5; }
  .theme-toggle .icon-moon{ color:#EDEDEF; opacity:.5; }
  [data-theme="light"] .theme-toggle .icon-sun{ opacity:1; }
  [data-theme="dark"] .theme-toggle .icon-moon{ opacity:1; }
  .toggle-knob{
    position:absolute; top:3px; left:3px;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="light"] .toggle-knob{ transform:translateX(26px); }

  .wrap{ max-width:900px; margin:0 auto; }
  .page-heading{ margin-bottom:28px; }
  .page-heading h1{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .page-heading p{ font-size:14px; color:var(--text-dim); margin-top:6px; }

  .panel{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:12px;
    margin-bottom:20px; overflow:hidden;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--border);
    background:var(--surface2); flex-wrap:wrap; gap:10px;
  }
  .panel-label{ font-size:13px; font-weight:600; color:var(--text-dim); }

  /* code editor with line-number gutter */
  .editor{
    position:relative;
    display:flex;
    background:var(--surface);
  }
  .gutter{
    flex-shrink:0;
    width:44px;
    padding:16px 0;
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-mute);
    background:var(--surface2);
    border-right:1px solid var(--border);
    overflow:hidden;
    user-select:none;
  }
  .gutter div{ padding-right:10px; }

  textarea#code{
    flex:1;
    width:100%; min-height:200px; resize:vertical;
    background:var(--surface); color:var(--text);
    border:none; outline:none;
    font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.6;
    padding:16px 18px; tab-size:4;
    white-space:pre;
    overflow:auto;
  }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 18px; border-radius:8px;
    font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:none;
    transition:opacity .15s ease, transform .1s ease; white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ opacity:.85; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-run{ background:var(--green-dim); color:var(--green); }
  .btn-clear{ background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong); }
  .btn-fullscreen{
    background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-strong);
    padding:8px 10px;
  }
  .btn-fullscreen svg{ width:15px; height:15px; display:block; }

  .panel.is-fullscreen{
    position:fixed; inset:0; z-index:1000; margin:0; border-radius:0;
    display:flex; flex-direction:column; height:100vh;
  }
  .panel.is-fullscreen .editor{ flex:1; }
  .panel.is-fullscreen textarea#code{ min-height:100%; height:100%; }

  .sql-hint{ font-size:12px; color:var(--text-mute); padding:10px 16px 0; }

  .status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--text-mute); }
  .status-dot.running{ background:var(--amber); animation:pulse 1s ease-in-out infinite; }
  .status-dot.success{ background:var(--green); }
  .status-dot.error{ background:var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .status-text{ font-size:12px; color:var(--text-mute); }
  .status-row{ display:flex; align-items:center; gap:8px; }

  pre.output{
    margin:0; padding:16px 18px; min-height:100px;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word; color:var(--text-dim);
  }
  pre.output.ok{ color:var(--text); }
  pre.output.err{ color:var(--red); }

  #output{ max-height:420px; overflow:auto; }
  .sql-result-table{ width:100%; border-collapse:collapse; font-family:'JetBrains Mono', monospace; font-size:12.5px; }
  .sql-result-table th, .sql-result-table td{
    padding:7px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;
  }
  .sql-result-table th{ color:var(--text-dim); font-weight:600; background:var(--surface2); position:sticky; top:0; }
  .sql-result-block{ margin-bottom:14px; overflow-x:auto; }
  .sql-result-block:last-child{ margin-bottom:0; }
  .sql-result-caption{ font-size:12px; color:var(--text-mute); padding:10px 16px 4px; }
  #schema{ padding-bottom:4px; overflow:hidden; max-height:0; transition:max-height .3s ease; }
  .schema-empty{ padding:16px 18px; font-size:13px; color:var(--text-mute); }
  @media (prefers-reduced-motion: reduce){ #schema{ transition:none; } }

  @media (max-width:560px){
    .page-title-bar{ display:none; }
    .toolbar{ width:100%; }
    .btn-run{ flex:1; }
  }
  @media (prefers-reduced-motion: reduce){ .btn, .toggle-knob{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="compiler.html">← Back</a>
  <span class="page-title-bar">SQL Compiler</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" role="switch" aria-checked="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <div class="toggle-knob"></div>
  </button>
</div>

<div class="wrap">
  <div class="page-heading">
    <h1>SQL Compiler</h1>
    <p>Run SQL queries against a sample database — entirely in your browser.</p>
  </div>

  <div class="panel" id="codePanel">
    <div class="panel-header">
      <span class="panel-label">query.sql</span>
      <div class="toolbar">
        <button class="btn btn-fullscreen" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
          <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <button class="btn btn-clear" id="resetBtn">Reset DB</button>
        <button class="btn btn-run" id="runBtn">▶ Run</button>
      </div>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter"><div>1</div></div>
      <textarea id="code" spellcheck="false">CREATE DATABASE school;

CREATE TABLE students (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  marks INTEGER NOT NULL
);

INSERT INTO students (name, marks) VALUES ('Aarav', 88);

SELECT * FROM students;</textarea>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Schema</span>
      <button class="btn btn-clear" id="schemaToggleBtn">Expand ▾</button>
    </div>
    <div id="schema"><pre class="output">No tables yet — create one to see it listed here.</pre></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Result</span>
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Idle</span>
      </div>
    </div>
    <div id="output"><pre class="output">Loading SQLite engine...</pre></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script>
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  let theme = 'dark';
  function applyTheme(t){
    theme = t;
    html.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
  }
  applyTheme(theme);
  themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

  const codeEl = document.getElementById('code');
  const gutterEl = document.getElementById('gutter');
  const outputEl = document.getElementById('output');
  const schemaEl = document.getElementById('schema');
  const schemaToggleBtn = document.getElementById('schemaToggleBtn');
  let schemaExpanded = false;

  function setSchemaExpanded(expanded) {
    schemaExpanded = expanded;
    schemaEl.style.maxHeight = expanded ? schemaEl.scrollHeight + 'px' : '0px';
    schemaToggleBtn.textContent = expanded ? 'Collapse ▴' : 'Expand ▾';
  }

  schemaToggleBtn.addEventListener('click', () => setSchemaExpanded(!schemaExpanded));
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const runBtn = document.getElementById('runBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fullscreenIcon = document.getElementById('fullscreenIcon');
  const codePanel = document.getElementById('codePanel');

  // ---- line-number gutter ----
  function updateGutter() {
    const lineCount = codeEl.value.split('\n').length;
    let html = '';
    for (let i = 1; i <= lineCount; i++) html += '<div>' + i + '</div>';
    gutterEl.innerHTML = html;
    gutterEl.scrollTop = codeEl.scrollTop;
  }
  codeEl.addEventListener('input', updateGutter);
  codeEl.addEventListener('scroll', () => { gutterEl.scrollTop = codeEl.scrollTop; });
  window.addEventListener('resize', updateGutter);
  updateGutter();

  // ---- fullscreen toggle ----
  const EXPAND_PATH = 'M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3';
  const COLLAPSE_PATH = 'M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3';

  function setFullscreenIcon(isFull) {
    fullscreenIcon.querySelector('path').setAttribute('d', isFull ? COLLAPSE_PATH : EXPAND_PATH);
    fullscreenBtn.title = isFull ? 'Exit fullscreen' : 'Fullscreen';
  }

  fullscreenBtn.addEventListener('click', async () => {
    const supportsFS = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (supportsFS) {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          await (codePanel.requestFullscreen ? codePanel.requestFullscreen() : codePanel.webkitRequestFullscreen());
        } else {
          await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
        }
        return;
      } catch (e) {
        // fall through to CSS-only fallback below
      }
    }
    codePanel.classList.toggle('is-fullscreen');
    setFullscreenIcon(codePanel.classList.contains('is-fullscreen'));
  });

  document.addEventListener('fullscreenchange', () => {
    setFullscreenIcon(!!document.fullscreenElement);
    updateGutter();
  });
  document.addEventListener('webkitfullscreenchange', () => {
    setFullscreenIcon(!!document.webkitFullscreenElement);
    updateGutter();
  });

  codeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = codeEl.selectionStart, end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, start) + '    ' + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
      updateGutter();
    }
  });

  let SQL = null;
  let db = null;

  const SEED_SQL = ``;

  function resetDb() {
    db = new SQL.Database();
    if (SEED_SQL.trim()) db.run(SEED_SQL);
  }

  // SQLite has no CREATE DATABASE / USE — treat them as harmless no-ops
  // so code written for MySQL-style dialects still runs without editing.
  function stripDatabaseStatements(sql) {
    return sql
      .replace(/CREATE\s+DATABASE\s+[^;]+;?/gi, '')
      .replace(/DROP\s+DATABASE\s+[^;]+;?/gi, '')
      .replace(/USE\s+[^;]+;?/gi, '');
  }

  // Translate common MySQL-style commands to their SQLite equivalents.
  function translateAliases(sql) {
    return sql
      .replace(/\bSHOW\s+TABLES\s*;/gi, "SELECT name AS table_name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
      .replace(/\b(?:DESCRIBE|DESC)\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*;/gi, 'PRAGMA table_info($1);');
  }

  function getTableNames() {
    try {
      const res = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;");
      if (!res || res.length === 0) return [];
      return res[0].values.map(row => row[0]);
    } catch (e) {
      return [];
    }
  }

  function refreshSchema() {
    if (!db) return;
    const tables = getTableNames();
    if (tables.length === 0) {
      schemaEl.innerHTML = '<div class="schema-empty">No tables yet — create one to see it listed here.</div>';
    } else {
      let out = '';
      tables.forEach(name => {
        const info = db.exec(`PRAGMA table_info(${name});`);
        const cols = info && info[0] ? info[0].values : [];
        out += '<div class="sql-result-block">';
        out += `<div class="sql-result-caption">${name} — ${cols.length} column(s)</div>`;
        out += '<table class="sql-result-table"><thead><tr><th>Column</th><th>Type</th><th>Not Null</th><th>Primary Key</th></tr></thead><tbody>';
        cols.forEach(c => {
          // pragma table_info columns: cid, name, type, notnull, dflt_value, pk
          out += `<tr><td>${c[1]}</td><td>${c[2] || '—'}</td><td>${c[3] ? 'Yes' : 'No'}</td><td>${c[5] ? 'Yes' : 'No'}</td></tr>`;
        });
        out += '</tbody></table></div>';
      });
      schemaEl.innerHTML = out;
    }
    // keep the expanded height accurate if the panel is currently open
    if (schemaExpanded) schemaEl.style.maxHeight = schemaEl.scrollHeight + 'px';
  }

  async function initSql() {
    statusDot.className = 'status-dot running';
    statusText.textContent = 'Loading SQLite engine...';
    try {
      SQL = await initSqlJs({ locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}` });
      resetDb();
      statusDot.className = 'status-dot success';
      statusText.textContent = 'Ready';
      outputEl.innerHTML = '<pre class="output">Hello! Made by Unish</pre>';
      refreshSchema();
    } catch (err) {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Failed to load';
      outputEl.innerHTML = '<pre class="output err">Could not load the SQL engine: ' + err.message + '</pre>';
    }
  }
  initSql();

  function renderResults(results) {
    if (!results || results.length === 0) {
      outputEl.innerHTML = '<pre class="output ok">Query ran successfully — no rows returned.</pre>';
      return;
    }
    let out = '';
    results.forEach((res, i) => {
      out += '<div class="sql-result-block">';
      out += `<div class="sql-result-caption">Result set ${i + 1} — ${res.values.length} row(s)</div>`;
      out += '<table class="sql-result-table"><thead><tr>';
      res.columns.forEach(col => { out += `<th>${col}</th>`; });
      out += '</tr></thead><tbody>';
      res.values.forEach(row => {
        out += '<tr>';
        row.forEach(cell => { out += `<td>${cell === null ? 'NULL' : cell}</td>`; });
        out += '</tr>';
      });
      out += '</tbody></table></div>';
    });
    outputEl.innerHTML = out;
  }

  function runQuery() {
    if (!db) {
      outputEl.innerHTML = '<pre class="output err">SQL engine is still loading, try again in a second.</pre>';
      return;
    }
    const rawQuery = codeEl.value.trim();
    if (!rawQuery) {
      outputEl.innerHTML = '<pre class="output err">Write a SQL query first.</pre>';
      return;
    }
    const query = translateAliases(stripDatabaseStatements(rawQuery)).trim();
    if (!query) {
      outputEl.innerHTML = '<pre class="output ok">Statement executed. (SQLite doesn\'t need CREATE DATABASE or USE — they were safely skipped. Add a CREATE TABLE statement to continue.)</pre>';
      statusDot.className = 'status-dot success';
      statusText.textContent = 'Success';
      return;
    }
    try {
      const results = db.exec(query);
      renderResults(results);
      refreshSchema();
      statusDot.className = 'status-dot success';
      statusText.textContent = 'Success';
    } catch (err) {
      outputEl.innerHTML = '<pre class="output err">' + err.message + '</pre>';
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Error';
    }
  }

  runBtn.addEventListener('click', runQuery);
  resetBtn.addEventListener('click', () => {
    if (SQL) {
      resetDb();
      outputEl.innerHTML = '<pre class="output">Hello! Made by Unish</pre>';
      statusDot.className = 'status-dot';
      statusText.textContent = 'Idle';
      refreshSchema();
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runQuery();
    }
  });
</script>
</body>
</html>
